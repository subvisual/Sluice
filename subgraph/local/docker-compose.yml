# Local graph-node stack for indexing an anvil fork of Base.
# The `ethereum` env names the chain `base` to match subgraph.yaml's network.
services:
  graph-node:
    image: graphprotocol/graph-node
    # loopback-only: nothing off-host should reach the admin/deploy ports
    ports:
      - '127.0.0.1:8000:8000' # GraphQL queries
      - '127.0.0.1:8020:8020' # admin (graph create/deploy)
      - '127.0.0.1:8030:8030' # indexing status
    depends_on:
      - ipfs
      - postgres
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: 'ipfs:5001'
      ethereum: 'base:http://host.docker.internal:8545'
      GRAPH_LOG: info
      # Tiny reorg/ancestor cache: the defaults (250 blocks, full tx bodies)
      # get proxied by anvil to the upstream RPC and never finish on a fork.
      ETHEREUM_REORG_THRESHOLD: '1'
      ETHEREUM_ANCESTOR_COUNT: '1'
  ipfs:
    image: ipfs/kubo:v0.17.0
    ports:
      - '127.0.0.1:5001:5001' # IPFS API — loopback-only
  postgres:
    image: postgres:14
    command: ['postgres', '-cshared_preload_libraries=pg_stat_statements', '-cmax_connections=200']
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=C'
